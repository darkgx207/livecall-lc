[package]
name = "livecall-client"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"

webrtc = "0.11"
cpal = "0.15"
opus = "0.3"
bytes = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
